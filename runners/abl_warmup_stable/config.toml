[case]
runner = "abl"
workflow = "warmup"
name = "abl_warmup_stable_gabls1_32cubed"

[domain]
nx = 32
ny = 32
nz = 32
lx_m = 400.0
ly_m = 400.0
lz_m = 400.0

[flow]
momentum_forcing = "geostrophic"
geostrophic_u_m_s = 8.0
geostrophic_v_m_s = 0.0
coriolis_s = 1.39e-4
initial_velocity_profile = "zero"

[wall]
model = "monin_obukhov"
roughness_length_m = 0.1
thermal_roughness_length_m = 0.1
von_karman = 0.4
filter_grid_ratio = 1.5
test_filter_ratio = 2.0

[thermal]
boundary_condition = "prescribed_surface_temperature"
initial_temperature_k = 265.0
reference_temperature_k = 263.5
inversion_height_m = 100.0
inversion_gradient_k_m = 0.01
perturbation_amplitude_k = 0.1
perturbation_height_m = 50.0
surface_cooling_k_s = -6.944444444444444e-5
gravity_m_s2 = 9.81

[sgs]
model = "lasd"
update_interval_steps = 5
filter_grid_ratio = 1.5
test_filter_ratio = 2.0
timescale_coefficient = 1.5
initial_coefficient = 0.03
minimum_coefficient = 1.0e-6
maximum_coefficient = 0.81

[time]
integrator = "ab2"
dt_seconds = 0.25
duration_hours = 9.0

[numerics]
dtype = "float32"
pressure_method = "spike"
seed = 0
cfl_abort = 1.0
cfl_warning = 0.9
lasd_trajectory_cfl_abort = 1.0

[output]
directory = "outputs/abl_warmup_stable_gabls1_32cubed"
sample_start_hours = 8.0
sample_every_steps = 240
log_every_steps = 1200
checkpoint_every_steps = 12000

[execution]
overwrite = false
