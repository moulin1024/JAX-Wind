[case]
runner = "abl"
workflow = "warmup"
name = "abl_warmup_convective_40x40x48"

[domain]
nx = 40
ny = 40
nz = 48
lx_m = 6400.0
ly_m = 6400.0
lz_m = 2400.0

[flow]
momentum_forcing = "none"
initial_velocity_profile = "zero"

[wall]
model = "neutral_log"
roughness_length_m = 0.16
thermal_roughness_length_m = 0.16
von_karman = 0.4
filter_grid_ratio = 1.5
test_filter_ratio = 2.0

[thermal]
boundary_condition = "fixed_surface_flux"
initial_temperature_k = 300.0
reference_temperature_k = 300.0
inversion_height_m = 1350.4
inversion_gradient_k_m = 0.003
perturbation_amplitude_k = 0.0021
perturbation_height_m = 1350.4
surface_heat_flux_k_m_s = 0.06
gravity_m_s2 = 9.81

[sgs]
model = "lasd"
update_interval_steps = 8
filter_grid_ratio = 1.5
test_filter_ratio = 2.0
timescale_coefficient = 1.5
initial_coefficient = 0.03
minimum_coefficient = 1.0e-6
maximum_coefficient = 0.81

[time]
integrator = "ab2"
dt_seconds = 1.25
duration_hours = 3.3493055555555555

[numerics]
dtype = "float32"
pressure_method = "spike"
seed = 0
cfl_abort = 1.0
cfl_warning = 0.8
lasd_trajectory_cfl_abort = 1.0

[output]
directory = "outputs/abl_warmup_convective_40x40x48"
sample_start_hours = 3.0
sample_every_steps = 20
log_every_steps = 96
checkpoint_every_steps = 960

[execution]
overwrite = false
