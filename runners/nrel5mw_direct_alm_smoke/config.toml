[case]
runner = "direct_aeroelastic_alm"
name = "nrel5mw_direct_aeroelastic_alm_128x128x512_smoke"

[domain]
nx = 128
ny = 128
nz = 512
lx_m = 512.0
ly_m = 512.0
lz_m = 512.0

[flow]
friction_velocity_m_s = 0.4
roughness_length_m = 0.1
forcing_height_m = 512.0
von_karman = 0.4

[sgs]
coefficient = 0.16

[time]
dt_seconds = 0.05
steps = 60

[numerics]
dtype = "float32"
pressure_method = "spike"
cfl_abort = 0.5

[aeroelastic]
enabled = true
air_density_kg_m3 = 1.225
gravity_m_s2 = 9.80665
maximum_tip_deflection_m = 20.0

[turbine]
location_m = [256.0, 256.0]
openfast_input_file = "openfast/NREL5MW_Rigid_Smoke.fst"
smoothing_width_m = 4.0

[output]
directory = "outputs/nrel5mw_direct_aeroelastic_alm_128x128x512_smoke"
log_every_steps = 10
flow_slice_every_steps = 2

[execution]
overwrite = false
