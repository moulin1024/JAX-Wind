[case]
runner = "pressure_driven_warmup"
name = "pressure_driven_mgm_64x64x64"

[domain]
nx = 32
ny = 32
nz = 32
lx_m = 4000
ly_m = 4000
lz_m = 1000.0

[flow]
friction_velocity_m_s = 0.4
roughness_length_m = 0.001
forcing_height_m = 1000.0
von_karman = 0.4
initial_perturbation_rms_m_s = 0.1
initial_correlation_length_m = 32.0

[wall]
model = "filtered_neutral_log"
filter_grid_ratio = 1.5
test_filter_ratio = 2.0
porte_agel_correction = true

[sgs]
model = "mgm"
filter_grid_ratio = 1.5
dissipation_coefficient = 1.0
fallback_coefficient = 0.1
# Equivalent to the demo's Gkk > 1e-6 threshold for zi = lx/(2*pi).
gradient_norm_epsilon_s2 = 2.4674011002723396e-12
kinematic_viscosity_m2_s = 1.5e-5
scalar_turbulent_prandtl = 0.4

# LASD-only values are retained so switching models remains a one-line edit.
update_interval_steps = 4
test_filter_ratio = 2.0
timescale_coefficient = 1.5
initial_coefficient = 0.03
minimum_coefficient = 1.0e-6
maximum_coefficient = 0.81

[time]
integrator = "ab2"
dt_seconds = 0.75
duration_hours = 2.5

[numerics]
dtype = "float32"
pressure_method = "spike"
seed = 2025
cfl_abort = 0.5
lasd_trajectory_cfl_abort = 1.0

[output]
directory = "outputs/pressure_driven_mgm_64x64x64"
log_every_steps = 1000
sample_start_hours = 0.8
sample_every_steps = 100
checkpoint_every_steps = 10000
