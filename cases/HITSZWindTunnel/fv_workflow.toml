[case]
name = "hitsz_r9_fv_warmup_256x64x128"
citation = "Yang, Lin & Zhou, Renewable Energy 220 (2024), 119625"
initial_profile = "fv_initial_profile.csv"
reference_results = "fv_reference_results.json"
seed = 2024

[domain]
cells = [256, 64, 128]
lengths_m = [24.0, 6.0, 3.6]

[scales]
length_m = 3.6
velocity_m_s = 1.0
scalar = 1.0

[flow]
pressure_acceleration_m_s2 = [0.004198491620939015, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 1.6100320416141182e-5
von_karman = 0.4

[scalar]
quantity = "passive_concentration"
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[time]
dt_seconds = 0.02
steps = 45000

[sgs]
filter_grid_ratio = 1.5
test_filter_ratio = 2.0
update_interval_steps = 4
timescale_coefficient = 1.5
momentum_initial_coefficient = 0.03
momentum_minimum_coefficient = 1.0e-6
momentum_maximum_coefficient = 0.81
scalar_initial_coefficient = 0.03
scalar_minimum_coefficient = 0.0
scalar_maximum_coefficient = 1.0
stratification_beta = 30.0
stratification_power = 2.0

[numerics]
dtype = "float32"
pressure_method = "transpose"
thomas_chunk = 1
cfl_warning = 0.75
cfl_abort = 1.05
trajectory_cfl_abort = 1.2

[diagnostics]
sample_start_step = 36000
sample_every_steps = 180
log_every_steps = 180
checkpoint_every_steps = 4500
reference_length_m = 1.26
reference_velocity_m_s = 3.3514673026030772
reference_scalar = 1.0
inversion_search_max_height_m = 3.6
spectrum_heights_m = [0.876]

[output]
directory = "outputs/hitsz_r9_fv_fft_fast_rk3_256x64x128"

[finite_volume]
pressure_backend = "fft"
time_integration = "fast-rk3"
cfl_ceiling = 1.0
momentum_closure = "amd"
turbulent_prandtl = 0.4
chunk_steps = 100
spectrum_diagnostic = "none"
output_directory = "outputs/hitsz_r9_fv_fft_fast_rk3_256x64x128"

[finite_volume_workflow]
warmup_steps = 45000
precursor_steps = 8000
main_steps = 8000
record_plane = 10
precursor_dt_seconds = 0.01125
main_dt_seconds = 0.01125
main_frame_count = 100
chunk_steps = 100
output_directory = "outputs/hitsz_r9_fv_workflow_256x64x128"
main_pressure_force = false
evolve_scalar = false


[finite_volume_turbine]
model = "hitsz-r9-ad-bem"
x_m = 12.0
y_m = 3.0
hub_height_m = 0.876
rotor_speed_rpm = 480.0
blade_pitch_degrees = 0.0
smoothing_width_m = 0.09375
smearing_azimuthal_elements = 64
body_smoothing_width_m = 0.1875
nacelle_drag_coefficient = 1.0
tower_drag_coefficient = 1.0
