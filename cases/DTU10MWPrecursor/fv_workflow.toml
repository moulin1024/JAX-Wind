[case]
name = "dtu10mw_adbem_fv_128x64x256"
citation = "Bak et al. (2013), Description of the DTU 10 MW Reference Wind Turbine"
initial_profile = "fv_initial_profile.csv"
reference_results = "fv_reference_results.json"
seed = 2025

[domain]
cells = [128, 64, 256]
lengths_m = [4096.0, 1024.0, 1024.0]

[scales]
length_m = 1024.0
velocity_m_s = 1.0
scalar = 1.0

[flow]
pressure_acceleration_m_s2 = [0.00015625, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 0.001
von_karman = 0.4

[scalar]
quantity = "passive_concentration"
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[time]
dt_seconds = 0.1
steps = 360000

[sgs]
filter_grid_ratio = 1.5
test_filter_ratio = 2.0
update_interval_steps = 4
timescale_coefficient = 1.5
momentum_initial_coefficient = 0.03
momentum_minimum_coefficient = 1.0e-6
momentum_maximum_coefficient = 0.81
scalar_initial_coefficient = 0.03
scalar_minimum_coefficient = 0.0
scalar_maximum_coefficient = 1.0
stratification_beta = 30.0
stratification_power = 2.0

[numerics]
dtype = "float32"
pressure_method = "transpose"
thomas_chunk = 1
cfl_warning = 0.25
cfl_abort = 0.5
trajectory_cfl_abort = 1.0

[diagnostics]
sample_start_step = 324000
sample_every_steps = 1000
log_every_steps = 1000
checkpoint_every_steps = 36000
reference_length_m = 1024.0
reference_velocity_m_s = 0.4
reference_scalar = 1.0
inversion_search_max_height_m = 1024.0
spectrum_heights_m = [118.0]

[output]
directory = "outputs/dtu10mw_adbem_fv_base_128x64x256"

[finite_volume]
pressure_backend = "gmg"
gmg_tolerance = 1.0e-5
gmg_presweeps = 1
gmg_postsweeps = 1
time_integration = "ab2"
momentum_closure = "amd"
turbulent_prandtl = 0.4
chunk_steps = 100
spectrum_diagnostic = "none"
output_directory = "outputs/dtu10mw_adbem_fv_{pressure_backend}_128x64x256"

[finite_volume_workflow]
warmup_steps = 360000
precursor_steps = 36000
main_steps = 36000
record_plane = 0
chunk_steps = 100
output_directory = "outputs/dtu10mw_adbem_fv_workflow_128x64x256"
main_pressure_force = false
evolve_scalar = false

[finite_volume_turbine]
model = "openfast-ad-bem"
openfast_model_environment = "JAXWIND_DTU10MW_FAST"
x_m = 1000.0
y_m = 512.0
hub_height_m = 117.76719422649163
rotor_speed_rpm = 9.6
blade_pitch_degrees = 0.0
smoothing_width_m = 32.0
smearing_azimuthal_elements = 64
body_smoothing_width_m = 96.0
nacelle_drag_coefficient = 1.0
tower_drag_coefficient = 1.0
