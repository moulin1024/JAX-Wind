schema_version = 1
formulation = "boussinesq"

[case]
name = "hornsrev1_80_v80_uniform10_open_gmg_1h"
citation = "User-supplied Horns Rev 1 coordinates; V80 lookup sources recorded in controller"
initial_profile = "fv_initial_profile_256_lz1024.csv"
reference_results = "fv_reference_results.json"
seed = 2026
# The uniform-inflow builder initializes u=10, v=w=0 directly.
# The legacy profile asset above is required by the shared case schema.

[mesh]
cells = [512, 512, 256]
lengths_m = [8192.0, 8192.0, 1024.0]

[time]
dt_seconds = 0.5
steps = 7200
chunk_steps = 12
checkpoint_every_steps = 720
frame_count = 100

[numerics]
# Archived centered-advection comparison baseline. New cases default to MUSCL-MC.
momentum_advection_scheme = "central"
dtype = "float32"
pressure_backend = "gmg"
gmg_tolerance = 1.0e-5
gmg_presweeps = 1
gmg_postsweeps = 1
time_integration = "fast-rk3"
turbulent_prandtl = 0.4
spectrum_diagnostic = "none"

[diagnostics]
sample_start_step = 0
sample_every_steps = 12
reference_length_m = 1024.0
reference_velocity_m_s = 10.0
reference_scalar = 1.0
inversion_search_max_height_m = 1024.0
spectrum_heights_m = [70.0]

[physics.flow]
pressure_acceleration_m_s2 = [0.0, 0.0]
geostrophic_velocity_m_s = [0.0, 0.0]
advection_frame_velocity_m_s = [0.0, 0.0]
coriolis_s = [0.0, 0.0]
roughness_length_m = 2.0e-4
von_karman = 0.4

[physics.scalar]
reference_value = 0.0
surface_flux = 0.0
buoyancy_acceleration_per_unit = 0.0

[physics.inflow]
model = "uniform"
speed_m_s = 10.0
lateral_boundary = "outflow"

[physics.turbine]
model = "openfast-ad-bem"
openfast_model_environment = "JAXWIND_V80_FAST"
x_m = 4096.0
y_m = 4096.0
hub_height_m = 70.0
rotor_speed_rpm = 18.0
blade_pitch_degrees = 0.0
smoothing_width_m = 16.0
smearing_azimuthal_elements = 64
body_smoothing_width_m = 16.0
nacelle_drag_coefficient = 0.0
tower_drag_coefficient = 0.0

[physics.wind_farm.controller]
model = "wind-speed-lookup"
probe_distance_diameters = 1.0
wind_filter_seconds = 5.0
# Explicit modeling policy: operating at cut-in, stopped at/above cut-out.
cut_in_m_s = 4.0
cut_out_m_s = 25.0
wind_speed_m_s = [4.0, 5.0, 6.0, 7.0, 8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 14.0, 15.0, 16.0, 17.0, 18.0, 19.0, 20.0, 21.0, 22.0, 23.0, 24.0, 25.0]
# Approximate readings from the averaged operating curve, NOT OEM setpoints.
# The final three points hold the last plotted RPM; see lookup README.
rpm = [12.5, 12.4, 13.1, 14.5, 16.3, 17.6, 18.0, 18.0, 18.0, 18.0, 18.0, 18.0, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1]
power_w = [66600.0, 154000.0, 282000.0, 460000.0, 696000.0, 996000.0, 1341000.0, 1661000.0, 1866000.0, 1958000.0, 1988000.0, 1997000.0, 1999000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0]
rpm_source = "Approximate manual readings, Hansen et al. (2012), doi:10.1002/we.512, Fig.2b, PDF p.21; 23-25 m/s held at 18.1 rpm. https://backend.orbit.dtu.dk/ws/files/6499345/paper0149_R2.pdf"
power_source = "DTU PyWake hornsrev1.py power_curve, 4-25 m/s, converted kW to W; retrieved 2026-09-15. https://gitlab.windenergy.dtu.dk/TOPFARM/PyWake/-/raw/master/py_wake/examples/data/hornsrev1.py"


# User coordinates translated by (+1337, +2150.5) m.
# Both arithmetic centroid and bounding-box center are (4096, 4096) m.

