schema_version = 1
extends = "fv_v80_periodic_smoke_512x512x256_1h.toml"

[case]
name = "hornsrev1_two_v80_lookup"

# Shared V80 AD-BEM geometry/pitch; no extra rotor at template coordinates.
[physics.wind_farm.controller]
model = "wind-speed-lookup"
probe_distance_diameters = 1.0
wind_filter_seconds = 5.0
# Explicit modeling policy: operating at cut-in, stopped at/above cut-out.
cut_in_m_s = 4.0
cut_out_m_s = 25.0
wind_speed_m_s = [4.0, 5.0, 6.0, 7.0, 8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 14.0, 15.0, 16.0, 17.0, 18.0, 19.0, 20.0, 21.0, 22.0, 23.0, 24.0, 25.0]
# Approximate readings from the averaged operating curve, NOT OEM setpoints.
# The final three points hold the last plotted RPM; see lookup README.
rpm = [12.5, 12.4, 13.1, 14.5, 16.3, 17.6, 18.0, 18.0, 18.0, 18.0, 18.0, 18.0, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1, 18.1]
power_w = [66600.0, 154000.0, 282000.0, 460000.0, 696000.0, 996000.0, 1341000.0, 1661000.0, 1866000.0, 1958000.0, 1988000.0, 1997000.0, 1999000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0, 2000000.0]
rpm_source = "Approximate manual readings, Hansen et al. (2012), doi:10.1002/we.512, Fig.2b, PDF p.21; 23-25 m/s held at 18.1 rpm. https://backend.orbit.dtu.dk/ws/files/6499345/paper0149_R2.pdf"
power_source = "DTU PyWake hornsrev1.py power_curve, 4-25 m/s, converted kW to W; retrieved 2026-09-15. https://gitlab.windenergy.dtu.dk/TOPFARM/PyWake/-/raw/master/py_wake/examples/data/hornsrev1.py"

[[physics.wind_farm.layout]]
id = "T01"
x_m = 3536.0
y_m = 4096.0
hub_height_m = 70.0
# Retained for schema compatibility; lookup mode initializes from local wind.
initial_rpm = 0.0

[[physics.wind_farm.layout]]
id = "T02"
x_m = 4096.0
y_m = 4096.0
hub_height_m = 70.0
initial_rpm = 0.0

[output]
directory = "outputs/hornsrev1_two_v80_lookup"
