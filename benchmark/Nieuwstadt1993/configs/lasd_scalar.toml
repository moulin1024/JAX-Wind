# Nieuwstadt, Mason, Moeng & Schumann (1993) dry CBL.
# Both momentum stress and potential-temperature SGS flux use LASD; the
# transported temperature feeds the resolved Boussinesq buoyancy term.

[grid]
nx = 40
ny = 40
nz = 48
lx = 6400.0
ly = 6400.0
lz = 2400.0
z_i = 1600.0

[time]
scheme = "rk3"
steps = 9646
log_every = 96
dt = 1.25

[physics]
u_fric = 0.0
zo = 0.16
bl_height = 1600.0
vonk = 0.4
pressure_force = 0.0
initial_condition = "default"
momentum_wall_model = "abl"
initial_velocity_noise = 0.0

[wall_filter]
fgr = 1.5
tfr = 2.0

[sgs]
model = "lasd"
precision = "float32"
# The run reports one advisory warning if max directional CFL exceeds 0.2 or
# if cs_count * max(CFL_x, CFL_y, CFL_z) reaches one; it continues afterward.
cs_count = 10
smag_cs = 0.18
sgs_delta_scale = 1.0

[numerics]
projection_mode = "stage"
horizontal_dealias = true
pressure_filter_nyquist = false
# Moeng and Schumann used the horizontally spectral Klemp--Durran radiation
# condition so hydrostatic gravity waves can leave the 2400 m domain.
top_boundary_condition = "klemp_durran"

[thermo]
enabled = true
moisture_enabled = false
theta0 = 300.0
g = 9.81
theta_bc = "flux"
theta_profile = "linear"
theta_initial_gradient = 0.003
theta_top_gradient = 0.003
surface_theta_flux = 0.06
qv0 = 0.0
qv_initial_gradient = 0.0
surface_qv_flux = 0.0
qv_floor = 0.0
scalar_sgs_model = "lasd"
prandtl_t = 0.33
schmidt_t = 0.33
scalar_stability_correction = true
scalar_stability_beta = 30.0
scalar_stability_power = 2.0
scalar_lasd_min = 0.0
scalar_lasd_max = 1.0
# Fifth-order WENO-Z restores the optimal low-dissipation linear stencil in
# smooth regions while suppressing the vertical two-grid-point scalar mode.
scalar_vertical_scheme = "weno5z"

[benchmark]
initial_zi_fraction = 0.844

[runtime]
precision = "float32"
sgs_precision = "float32"
use_jit = true
