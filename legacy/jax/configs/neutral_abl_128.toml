# Single-process neutral ABL case for jax/run_single.py.
# Domain lengths are physical lengths in meters, and dt is physical seconds.
# The runner normalizes lengths and time internally by z_i; if z_i is omitted,
# z_i defaults to lz.

[grid]
nx = 256
ny = 256
nz = 256
lx = 6283.185307179586
ly = 6283.185307179586
lz = 1000

[time]
scheme = "ab2"
steps = 10000
log_every = 100
dt = 0.2

[physics]
u_fric = 0.38
zo = 5.0e-3
bl_height = 1000.0
vonk = 0.4

[wall_filter]
fgr = 1.5
tfr = 2.0

[sgs]
model = "lasd"
precision = "float32"
cs_count = 10
smag_cs = 0.16

[numerics]
projection_mode = "final"  # used only when [time].scheme = "rk4"
horizontal_dealias = true
pressure_filter_nyquist = false

[thermo]
enabled = false
moisture_enabled = false
theta0 = 300.0
g = 9.81
theta_initial_gradient = 0.0  # K/m
surface_theta_flux = 0.0      # K m/s, positive upward
qv0 = 0.0                     # kg/kg
qv_initial_gradient = 0.0     # kg/kg/m
surface_qv_flux = 0.0         # kg/kg m/s, positive upward
qv_floor = 0.0
scalar_sgs_model = "lasd"
prandtl_t = 0.74
schmidt_t = 0.74
scalar_lasd_min = 0.0
scalar_lasd_max = 1.0

[runtime]
precision = "float64"
use_jit = true

[profiling]
enabled = false
warmup = 100

[postprocess]
dump_fields = true
field_dump_start_step = 0
field_output_dir = "jax_fields"
field_output_prefix = "fields"
