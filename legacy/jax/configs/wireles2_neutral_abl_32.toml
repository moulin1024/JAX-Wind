# Single-process Fourier/compact-FD neutral ABL case for jax/run_wireles2.py.
# Domain lengths and dt are the values used directly by wireles2.

[grid]
nx = 64
ny = 64
nz = 64
lx = 1000.0
ly = 1000.0
lz = 1000.0

[time]
scheme = "ab2"
steps = 10000
log_every = 100
dt = 0.05

[physics]
u_fric = 0.4
zo = 1.0e-4
vonk = 0.4
pressure_force = "balanced"
nu = 0.0
initial_perturbation_amp = 0.25
spinup_forcing_accel = 0.01
spinup_forcing_steps = 3000

[sgs]
model = "dynamic_smagorinsky"
precision = "float32"
fgr = 1.5
tfr = 2.0
cs_count = 10
smag_cs = 0.16
dynamic_cs_max = 0.23
dynamic_cs_floor = 0.08
dynamic_relaxation = 0.05
dynamic_smooth_passes = 2
lasd_cheb_filter = false
lasd_cheb_filter_alpha = 36.0
lasd_cheb_filter_order = 8

[wall]
model = "balanced_loglaw"
filter = true
stress_treatment = "weak_flux"
# ref_height = 0.02

[numerics]
convective_form = "skew"
horizontal_dealias = true
vertical_dealias = true
solution_filter = true
vertical_dealias_cutoff_ratio = 0.6666666666666666
vertical_dealias_filter_alpha = 18.0
vertical_dealias_filter_order = 8

[runtime]
precision = "float64"
use_jit = true
seed = 0

[postprocess]
dump_fields = true
field_clean_output = true
field_dump_start_step = 0
field_output_dir = "wireles2_fields"
field_output_prefix = "fields"
