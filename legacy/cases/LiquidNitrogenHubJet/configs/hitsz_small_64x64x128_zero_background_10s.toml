# Small-domain HITSZ LN2 case: 6 x 3 x 1.8 m on 64 x 64 x 128 cells, no
# ambient wind, 10 s.
#
# Spacings are dx = 0.09375 m (unchanged from the half-length case), but
# dy = 0.046875 m and dz = 0.0140625 m are both halved. CFL here is set by the
# buoyant downdraft against dz, so halving dz doubles it: dt therefore drops
# from 0.001 s to 0.0005 s, which holds CFL near 0.09 at w = 2.5 m/s.
#
# The nozzle keeps its physical 0.876 m hub height, which now sits at 49% of
# the domain height instead of 24%. The 10 s run in the taller box threw a
# compensating updraft to ~2.5 m, so that return flow will feel the rigid lid
# here; the near-nozzle descent is still resolved, but the large-scale
# overturning cell is confined by construction.
#
# The box is 8x smaller in volume, so the same 0.0125 kg/s of LN2 cools the
# whole domain about 8x faster: expect ~1.35 K of domain-mean drift over 10 s
# against the 300 K buoyancy reference (0.17 K in the previous box). Still
# small at 10 s, but this case cannot be extended far without ventilation.
#
# The initial condition must be "geostrophic" with zero geostrophic wind, not
# "uniform_flow": initial_sharded_state (the initializer this distributed
# runner uses) has no uniform_flow branch, so uniform_flow falls through to the
# full u_fric log-law profile and silently reintroduces a ~3.8 m/s wind.
# coriolis_f = 0 keeps the geostrophic/Coriolis forcing term inert.

[grid]
nx = 64
ny = 64
nz = 128
lx = 6.0
ly = 3.0
lz = 1.8
z_i = 1.0

[time]
scheme = "ab2"
steps = 20000
log_every = 2000
dt = 0.0005

[physics]
u_fric = 0.12294132680014663
zo = 1.6100320416141182e-5
bl_height = 1.8
vonk = 0.4
pressure_force = 0.0
pressure_force_height = 1.8
horizontal_homogeneous = true
initial_condition = "geostrophic"
coriolis_f = 0.0
geostrophic_u = 0.0
geostrophic_v = 0.0
uniform_u = 0.0
uniform_v = 0.0
momentum_wall_model = "abl"
wall_stress_model = "dynamic_neutral"
initial_velocity_noise = 0.02
molecular_viscosity = 1.5e-5
molecular_diffusivity = 2.5e-5

[wall_filter]
fgr = 1.5
tfr = 2.0

[sgs]
model = "lasd"
cs_count = 4
scale_dependent = true
precision = "float32"

[numerics]
projection_mode = "stage"
horizontal_dealias = true
pressure_filter_nyquist = true
sharded_pressure_solver = "transpose"
top_boundary_condition = "rigid_lid"

[thermo]
enabled = true
moisture_enabled = true
theta0 = 300.0
g = 9.81
buoyancy_reference = "ambient"
theta_bc = "flux"
theta_profile = "uniform"
surface_theta_flux = 0.0
qv0 = 0.011
surface_qv_flux = 0.0
qv_floor = 0.0
surface_pressure = 100000.0
scalar_sgs_model = "fixed_prandtl"
prandtl_t = 0.74
schmidt_t = 0.74
scalar_vertical_scheme = "centered"

[actuator_disk]
enabled = false

[cold_source]
enabled = false
x = 3.0
y = 1.5
z = 0.876
sigma_x = 0.09375
sigma_r = 0.005
momentum_flux = 0.0
cooling_power = 0.0
density = 1.225
heat_capacity = 1005.0

[fringe]
enabled = false
start_x = 5.25
timescale = 0.1
target_u = 0.0
target_v = 0.0
target_theta = 300.0

[mass_outlet]
enabled = true
start_x = 5.25
end_x = 6.0
timescale = 1.0

[cryogenic]
enabled = true
max_parcels_per_shard = 8192
parcels_per_step = 8
turbulent_dispersion_enabled = true
injection_streamwise_cells = 0.0
injection_ramp_time = 0.05
initial_diameter = 0.000150
minimum_diameter = 0.000050
maximum_diameter = 0.000300
rosin_rammler_spread = 3.0
substeps = 4
saturation_timescale = 0.01
freezing_timescale = 0.05
melting_timescale = 0.05
liquid_fog_diameter = 0.000010
ice_fog_diameter = 0.000020
shortwave_flux = 0.0
shortwave_absorption_efficiency = 0.0
radiation_temperature = 300.0
liquid_emissivity = 0.96

[runtime]
precision = "float32"
sgs_precision = "float32"
use_jit = true
