# Nieuwstadt, Mason, Moeng & Schumann (1993) dry CBL comparison case.
# Mason-like stable SGS parameters from paper Table 1: Cs=0.32, Pr=0.46.
# The grid remains uniform here; Mason's original code used a stretched top grid.

[grid]
nx = 40
ny = 40
nz = 48
lx = 6400.0
ly = 6400.0
lz = 2400.0
z_i = 1600.0

[time]
scheme = "ab2"
steps = 8012
log_every = 80
dt = 1.5

[physics]
u_fric = 0.0
zo = 0.16
bl_height = 1600.0
vonk = 0.4
pressure_force = 0.0
initial_condition = "default"
momentum_wall_model = "abl"
initial_velocity_noise = 0.0

[wall_filter]
fgr = 1.5
tfr = 2.0

[sgs]
model = "smagorinsky"
precision = "float32"
cs_count = 10
smag_cs = 0.32
sgs_delta_scale = 1.0

[numerics]
projection_mode = "stage"
horizontal_dealias = true
pressure_filter_nyquist = false

[thermo]
enabled = true
moisture_enabled = false
theta0 = 300.0
g = 9.81
theta_bc = "flux"
theta_profile = "linear"
theta_initial_gradient = 0.003
theta_top_gradient = 0.003
surface_theta_flux = 0.06
qv0 = 0.0
qv_initial_gradient = 0.0
surface_qv_flux = 0.0
qv_floor = 0.0
scalar_sgs_model = "fixed_prandtl"
prandtl_t = 0.46
schmidt_t = 0.46
scalar_lasd_min = 0.0
scalar_lasd_max = 1.0

[benchmark]
initial_zi_fraction = 0.844

[runtime]
precision = "float64"
sgs_precision = "float32"
use_jit = true
